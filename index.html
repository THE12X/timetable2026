<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fall 2026 Timetable</title>
    
    <link rel="icon" type="image/x-icon" href="icon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        cloudGray: '#e2e8f0',
                        cloudGrayLight: '#f1f5f9',
                        jetBlack: '#0a0a0c',
                        jetBlackCard: '#121215'
                    }
                } 
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        html, body { height: 100%; }
        body { 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            background-color: #e2e8f0;
            color: #0a0a0c;
        }
        .dark body { 
            background-color: #0a0a0c;
            color: #f1f5f9;
        }

        select option { background-color: #ffffff; color: #0a0a0c; }
        .dark select option { background-color: #121215; color: #f1f5f9; }

        .table-wrapper {
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            border-radius: 1rem;
            border: 1px solid #cbd5e1;
            background: #ffffff;
        }
        .dark .table-wrapper {
            border-color: #27272a;
            background: #121215;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }

        .tt-grid {
            display: grid;
            grid-template-columns: 42px repeat(5, minmax(0, 1fr));
            grid-template-rows: 30px repeat(4, minmax(0, 1fr));
            width: 100%;
            height: 100%;
            min-height: 360px;
        }
        @media (min-width: 768px) {
            .tt-grid {
                grid-template-columns: 70px repeat(5, minmax(0, 1fr));
                grid-template-rows: 36px repeat(4, minmax(0, 1fr));
                min-height: 480px;
            }
        }
        #timetableBody { display: contents; }

        .tt-head, .tt-time, .tt-cell {
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            min-width: 0;
            min-height: 0;
        }
        .dark .tt-head, .dark .tt-time, .dark .tt-cell {
            border-right-color: #27272a;
            border-bottom-color: #27272a;
        }
        .tt-grid > :nth-child(6n) { border-right: none; }

        .tt-head {
            position: sticky; top: 0; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            background-color: #f1f5f9;
            color: #0a0a0c;
            text-transform: uppercase;
            font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em;
        }
        @media (min-width: 768px) { .tt-head { font-size: 0.7rem; letter-spacing: 0.05em; } }
        .dark .tt-head { background-color: #18181b; color: #cbd5e1; }

        .tt-corner, .tt-time {
            position: sticky; left: 0;
            background-color: rgba(241, 245, 249, 0.95);
            backdrop-filter: blur(8px);
            border-right: 2px solid #cbd5e1;
        }
        .tt-corner { z-index: 20; }
        .tt-time {
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-weight: 600;
        }
        .dark .tt-corner, .dark .tt-time {
            background-color: rgba(24, 24, 27, 0.95);
            border-right-color: #27272a;
        }

        .tt-cell { padding: 2px; overflow: hidden; }
        @media (min-width: 768px) { .tt-cell { padding: 0.4rem; } }
        .tt-cell > .course-card { height: 100%; width: 100%; }

        .course-card { overflow-wrap: anywhere; hyphens: auto; }

        .table-wrapper::-webkit-scrollbar { height: 8px; width: 8px; }
        .table-wrapper::-webkit-scrollbar-track { background: transparent; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; border: 2px solid #ffffff; }
        .dark .table-wrapper::-webkit-scrollbar-thumb { background: #3f3f46; border-color: #121215; }

        /* Course palette */
        .bg-DataStructure { background: linear-gradient(135deg, #eff6ff, #dbeafe); color: #1e40af; border-left: 3px solid #3b82f6; }
        .bg-DiscreteMath { background: linear-gradient(135deg, #e0f2fe, #bae6fd); color: #0369a1; border-left: 3px solid #0284c7; }
        .bg-LinearAlgebra { background: linear-gradient(135deg, #eef2ff, #e0e7ff); color: #3730a3; border-left: 3px solid #6366f1; }
        .bg-Chinese { background: linear-gradient(135deg, #fff1f2, #ffe4e6); color: #9f1239; border-left: 3px solid #f43f5e; }
        .bg-English { background: linear-gradient(135deg, #f0fdfa, #ccfbf1); color: #115e59; border-left: 3px solid #14b8a6; }
        .bg-Circuit { background: linear-gradient(135deg, #fffbeb, #fef3c7); color: #92400e; border-left: 3px solid #f59e0b; }
        .bg-China { background: linear-gradient(135deg, #fdf2f8, #fbcfe8); color: #9d174d; border-left: 3px solid #ec4899; }
        @media (min-width: 768px) {
            .bg-DataStructure, .bg-DiscreteMath, .bg-LinearAlgebra, .bg-Chinese,
            .bg-English, .bg-Circuit, .bg-China { border-left-width: 4px; }
        }

        .dark .bg-DataStructure { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(59,130,246,0.08)); color: #93c5fd; }
        .dark .bg-DiscreteMath { background: linear-gradient(135deg, rgba(2,132,199,0.2), rgba(2,132,199,0.08)); color: #7dd3fc; }
        .dark .bg-LinearAlgebra { background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(99,102,241,0.08)); color: #a5b4fc; }
        .dark .bg-Chinese { background: linear-gradient(135deg, rgba(244,63,94,0.2), rgba(244,63,94,0.08)); color: #fda4af; }
        .dark .bg-English { background: linear-gradient(135deg, rgba(20,184,166,0.2), rgba(20,184,166,0.08)); color: #5eead4; }
        .dark .bg-Circuit { background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(245,158,11,0.08)); color: #fcd34d; }
        .dark .bg-China { background: linear-gradient(135deg, rgba(236,72,153,0.2), rgba(236,72,153,0.08)); color: #f9a8d4; }

        .course-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (hover: hover) {
            .course-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.15); }
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: scale(1); } }
        .animate-fade { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="transition-colors duration-300 h-[100dvh] w-screen flex flex-col p-2 md:p-4 box-border m-0">

    <div class="max-w-6xl w-full mx-auto flex flex-col h-full gap-2 md:gap-3 overflow-hidden">

        <!-- Header -->
        <div class="flex-none flex flex-wrap md:flex-nowrap justify-between items-center bg-white dark:bg-[#121215] p-2.5 md:p-4 rounded-2xl shadow border border-slate-300 dark:border-zinc-800 gap-2 md:gap-3 z-10">

            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-[#0a0a0c] dark:bg-slate-200 flex items-center justify-center text-white dark:text-[#0a0a0c] shadow-md shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold text-[#0a0a0c] dark:text-[#f1f5f9] leading-tight">Fall 2026</h1>
                    <p class="text-[10px] md:text-xs text-slate-600 dark:text-slate-400 font-medium leading-tight">Computer Science Timetable</p>
                </div>
            </div>

            <button onclick="toggleTheme()" class="md:order-3 p-2 rounded-xl bg-[#e2e8f0] dark:bg-zinc-900 text-[#0a0a0c] dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-zinc-800 transition-colors shadow-sm" title="Toggle Theme">
                <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>

            <div class="flex items-center justify-between w-full md:w-auto md:order-2 bg-[#e2e8f0] dark:bg-zinc-900 p-1 rounded-xl shadow-inner gap-1 border border-slate-300 dark:border-zinc-800">
                <button onclick="changeWeek(-1)" class="px-3 py-1.5 rounded-lg bg-white dark:bg-[#121215] shadow-sm hover:shadow text-xs font-semibold text-[#0a0a0c] dark:text-slate-200 transition-all hover:bg-slate-100 dark:hover:bg-zinc-800">&larr; Prev</button>
                <select id="weekSelector" onchange="jumpToWeek(this.value)" class="flex-1 md:flex-none px-2 py-1.5 bg-transparent font-bold text-[#0a0a0c] dark:text-white focus:outline-none cursor-pointer text-center appearance-none text-xs md:text-sm rounded-lg border-none"></select>
                <button onclick="changeWeek(1)" class="px-3 py-1.5 rounded-lg bg-white dark:bg-[#121215] shadow-sm hover:shadow text-xs font-semibold text-[#0a0a0c] dark:text-slate-200 transition-all hover:bg-slate-100 dark:hover:bg-zinc-800">Next &rarr;</button>
            </div>
        </div>

        <!-- Timetable -->
        <div class="table-wrapper flex-1 min-h-0">
            <div id="timetable" class="tt-grid">
                <div class="tt-head tt-corner"><span class="md:hidden">Time</span><span class="hidden md:inline">Time</span></div>
                <div class="tt-head"><span class="md:hidden">Mon</span><span class="hidden md:inline">Monday</span></div>
                <div class="tt-head"><span class="md:hidden">Tue</span><span class="hidden md:inline">Tuesday</span></div>
                <div class="tt-head"><span class="md:hidden">Wed</span><span class="hidden md:inline">Wednesday</span></div>
                <div class="tt-head"><span class="md:hidden">Thu</span><span class="hidden md:inline">Thursday</span></div>
                <div class="tt-head"><span class="md:hidden">Fri</span><span class="hidden md:inline">Friday</span></div>
                <div id="timetableBody"><!-- Populated by JS --></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="courseModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-opacity" onclick="closeModal(event)">
        <div class="bg-white dark:bg-[#121215] border border-slate-300 dark:border-zinc-800 rounded-2xl shadow-2xl p-0 max-w-xs w-full overflow-hidden transform transition-transform scale-95" id="modalContent" onclick="event.stopPropagation()">
            <div id="modalHeader" class="p-5 text-white bg-gradient-to-r from-blue-600 to-indigo-600">
                <div class="flex justify-between items-start gap-2">
                    <h2 id="modalTitle" class="text-lg font-bold leading-tight">Course Name</h2>
                    <button onclick="closeModal()" class="text-white/70 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-7 h-7 shrink-0 transition-colors">&times;</button>
                </div>
            </div>
            <div class="p-5 space-y-3">
                <div class="flex items-center gap-3 text-slate-700 dark:text-slate-300">
                    <div class="p-1.5 bg-slate-100 dark:bg-zinc-800 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></div>
                    <div><p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Instructor</p><p id="modalInstructor" class="font-semibold text-xs"></p></div>
                </div>
                <div class="flex items-center gap-3 text-slate-700 dark:text-slate-300">
                    <div class="p-1.5 bg-slate-100 dark:bg-zinc-800 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg></div>
                    <div><p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Room</p><p id="modalRoom" class="font-semibold text-xs"></p></div>
                </div>
                <div class="flex items-center gap-3 text-slate-700 dark:text-slate-300">
                    <div class="p-1.5 bg-slate-100 dark:bg-zinc-800 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                    <div><p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Time</p><p id="modalTime" class="font-semibold text-xs"></p></div>
                </div>
                <div class="flex items-center gap-3 text-slate-700 dark:text-slate-300">
                    <div class="p-1.5 bg-slate-100 dark:bg-zinc-800 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>
                    <div><p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Active Weeks</p><p id="modalWeeks" class="font-semibold text-xs"></p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MIN_WEEK = 11;
        const MAX_WEEKS = 19;
        let currentWeek = 11;

        const courses = {
            "DS": { name: "Data Structure", instructor: "Ms. Fang Yuan", room: "201", color: "bg-DataStructure", modalGrad: "from-blue-600 to-indigo-600" },
            "DM": { name: "Discrete Mathematics", instructor: "Ms. Shao Huiyan", room: "101", color: "bg-DiscreteMath", modalGrad: "from-sky-600 to-blue-600" },
            "LA": { name: "Linear Algebra", instructor: "Ms. Liu Yan", room: "101", color: "bg-LinearAlgebra", modalGrad: "from-indigo-600 to-violet-600" },
            "CC": { name: "Comprehensive Chinese III", instructor: "Ms. Yang Yanqing", color: "bg-Chinese", modalGrad: "from-rose-600 to-pink-600" },
            "EC": { name: "English Composition", instructor: "Ms. Wu Jie", color: "bg-English", modalGrad: "from-teal-600 to-emerald-600" },
            "CET": { name: "Circuit & Electronic Tech", instructor: "Ms. Chu Ran", color: "bg-Circuit", modalGrad: "from-amber-600 to-orange-600" },
            "OC": { name: "Overview of China", instructor: "Ms. Yu Yan", room: "101", color: "bg-China", modalGrad: "from-pink-600 to-rose-600" }
        };

        const timeSlots = [
            { id: "T1", start: "08:00", end: "09:40", raw: "08:00 - 09:40" },
            { id: "T2", start: "10:05", end: "11:45", raw: "10:05 - 11:45" },
            { id: "T3", start: "13:20", end: "14:55", raw: "13:20 - 14:55" },
            { id: "T4", start: "15:15", end: "16:50", raw: "15:15 - 16:50" }
        ];

        const schedule = [
            // Monday (0)
            { 
                T1: [], 
                T2: [
                    { id: "DM", weeks: "1-4,7-14", room: "101" },
                    { id: "CET", weeks: "15", room: "506", title: "Circuit Exp 2 (Ex 2)" },
                    { id: "CET", weeks: "16", room: "506", title: "Circuit Exp 4 (Ex 4)" }
                ], 
                T3: [
                    { id: "DS", weeks: "1-4,7-16", room: "201" }, 
                    { id: "DS", weeks: "17", room: "201", title: "Data Structure Project Week" }
                ], 
                T4: [
                    { id: "DS", weeks: "1-4,7-16", room: "201" }, 
                    { id: "DS", weeks: "17", room: "201", title: "Data Structure Project Week" }
                ] 
            },
            // Tuesday (1)
            { T1: [{ id: "CC", weeks: "1-4,7-18", room: "101" }], T2: [{ id: "CET", weeks: "1-3", room: "101" }], T3: [{ id: "EC", weeks: "1-4", room: "101" }], T4: [] },
            // Wednesday (2)
            { T1: [{ id: "DM", weeks: "1-4,7-14", room: "101" }], T2: [{ id: "EC", weeks: "1-4", room: "201" }, { id: "CET", weeks: "11-13", room: "201" }], T3: [{ id: "OC", weeks: "8-19", room: "101" }], T4: [{ id: "OC", weeks: "8-19", room: "101" }] },
            // Thursday (3)
            { 
                T1: [{ id: "LA", weeks: "3-4", room: "101" }], 
                T2: [{ id: "LA", weeks: "3-4", room: "101" }], 
                T3: [
                    { id: "LA", weeks: "7-11", room: "101" },
                    { id: "CET", weeks: "14", room: "506", title: "Circuit Exp 1 (Ex 1)" },
                    { id: "CET", weeks: "15", room: "506", title: "Circuit Exp 3 (Ex 3)" }
                ], 
                T4: [
                    { id: "CET", weeks: "2-4,6-8", room: "101" }, 
                    { id: "LA", weeks: "9-12", room: "101" }
                ] 
            },
            // Friday (4)
            { 
                T1: [{ id: "EC", weeks: "7-10", room: "201" }], 
                T2: [{ id: "CC", weeks: "1-3,6-18", room: "201" }], 
                T3: [{ id: "CC", weeks: "11,14", room: "201", title: "Comprehensive Chinese III (Extra)" }], 
                T4: [] 
            }
        ];

        function isWeekActive(ruleStr, targetWeek) {
            if (!ruleStr) return false;
            return ruleStr.split(',').some(part => {
                if (part.includes('-')) {
                    const [start, end] = part.split('-').map(Number);
                    return targetWeek >= start && targetWeek <= end;
                }
                return targetWeek === Number(part);
            });
        }

        function init() {
            const selector = document.getElementById('weekSelector');
            for (let i = MIN_WEEK; i <= MAX_WEEKS; i++) {
                const opt = document.createElement('option');
                opt.value = i; opt.text = `Week ${i}`;
                selector.appendChild(opt);
            }
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            renderWeek(currentWeek);
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        }

        function changeWeek(delta) {
            const newWeek = currentWeek + delta;
            if (newWeek >= MIN_WEEK && newWeek <= MAX_WEEKS) renderWeek(newWeek);
        }

        function jumpToWeek(weekVal) { renderWeek(parseInt(weekVal)); }

        function renderWeek(week) {
            currentWeek = week;
            document.getElementById('weekSelector').value = week;

            const body = document.getElementById('timetableBody');
            body.innerHTML = '';

            timeSlots.forEach(slot => {
                const timeCell = document.createElement('div');
                timeCell.className = "tt-time text-[9px] md:text-xs text-slate-600 dark:text-slate-400 tracking-wide leading-tight";
                timeCell.innerHTML = `<div>${slot.start}<br><span class='hidden md:inline text-slate-400 text-[9px]'>to<br></span><span class='md:hidden text-slate-400'>–<br></span>${slot.end}</div>`;
                body.appendChild(timeCell);

                for (let day = 0; day < 5; day++) {
                    const cell = document.createElement('div');
                    cell.className = "tt-cell animate-fade";

                    const activeClass = schedule[day][slot.id].find(c => isWeekActive(c.weeks, week));
                    if (activeClass) {
                        const courseInfo = courses[activeClass.id];
                        const roomInfo = activeClass.room || courseInfo.room || '—';
                        const title = activeClass.title || courseInfo.name;

                        cell.innerHTML = `
                            <div class="course-card rounded-lg md:rounded-xl p-1 md:p-2 cursor-pointer flex flex-col justify-between overflow-hidden border ${courseInfo.color} border-black/5 dark:border-white/5"
                                 onclick="openModal('${activeClass.id}', '${activeClass.weeks}', '${roomInfo}', '${slot.raw}', '${title}')">
                                <div class="font-bold text-[9px] md:text-[13px] leading-tight md:leading-snug line-clamp-5 md:line-clamp-3">${title}</div>
                                <div class="mt-0.5 md:mt-1 flex justify-between items-end text-[8px] md:text-[11px] opacity-90 font-medium">
                                    <span class="hidden md:block truncate pr-1">${courseInfo.instructor}</span>
                                    <span class="bg-black/5 dark:bg-white/10 px-1 py-0.5 rounded whitespace-nowrap">Rm ${roomInfo}</span>
                                </div>
                            </div>`;
                    }
                    body.appendChild(cell);
                }
            });
        }

        function openModal(courseId, weeks, room, time, title) {
            const course = courses[courseId];
            document.getElementById('modalTitle').textContent = title || course.name;
            document.getElementById('modalInstructor').textContent = course.instructor;
            document.getElementById('modalRoom').textContent = "Room " + room;
            document.getElementById('modalTime').textContent = time;
            document.getElementById('modalWeeks').textContent = "Weeks " + weeks;
            document.getElementById('modalHeader').className = `p-5 text-white bg-gradient-to-r ${course.modalGrad}`;

            const modal = document.getElementById('courseModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            requestAnimationFrame(() => {
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            });
        }

        function closeModal(e) {
            if (e && e.target !== e.currentTarget) return;
            const modal = document.getElementById('courseModal');
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 150);
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('courseModal').classList.contains('hidden')) {
                if (e.key === 'ArrowLeft') changeWeek(-1);
                if (e.key === 'ArrowRight') changeWeek(1);
            } else if (e.key === 'Escape') {
                closeModal();
            }
        });

        window.onload = init;
    </script>
</body>
</html>
